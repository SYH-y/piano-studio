name: Validate PIANO STUDIO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check web and desktop versions match
        run: |
          python - <<'PY'
          import json, re, sys

          desktop = json.load(open('desktop/package.json', encoding='utf-8'))['version']
          source = open('version.js', encoding='utf-8').read()
          match = re.search(r"PIANO_STUDIO_VERSION\\s*=\\s*['\"]([^'\"]+)", source)
          if not match:
              print('::error::version.js 没有找到 PIANO_STUDIO_VERSION')
              sys.exit(1)
          web = match.group(1)
          if web != desktop:
              print(f'::error::网页版本 {web} 与桌面版本 {desktop} 不一致')
              sys.exit(1)
          print(f'版本号一致：{web}')
          PY

      - name: Check manifest icons match real files
        run: |
          # 两个坑都真实发生过，所以一起守住：
          # 1) 清单里写的尺寸和图片实际尺寸不一致（1536x1536 vs 1254x1254），
          #    浏览器在「安装到主屏幕」时会挑不到图标；
          # 2) 图片本身被截断（只传了一半，786KB 而非 1.55MB），
          #    IHDR 里的宽高仍然可读，但 IDAT 解压会失败、也缺 IEND，
          #    浏览器/资源管理器会显示残缺或空白。
          # 这里完整解码一遍，任何一项不满足就失败。
          python - <<'PY'
          import json, os, struct, sys, zlib

          def inspect(path):
              with open(path, 'rb') as fh:
                  data = fh.read()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  return None, '不是 PNG'
              width = height = None
              idat = b''
              pos = 8
              saw_iend = False
              while pos + 8 <= len(data):
                  length = int.from_bytes(data[pos:pos + 4], 'big')
                  kind = data[pos + 4:pos + 8]
                  if kind == b'IHDR':
                      width, height = struct.unpack('>II', data[pos + 8:pos + 16])
                  elif kind == b'IDAT':
                      idat += data[pos + 8:pos + 8 + length]
                  elif kind == b'IEND':
                      saw_iend = True
                      break
                  pos += 12 + length
              if width is None:
                  return None, '缺少 IHDR'
              if not saw_iend:
                  return None, '文件被截断（没有 IEND，可能只上传了一半）'
              try:
                  zlib.decompress(idat)
              except Exception as err:
                  return None, '像素数据损坏（%s）' % err
              return (width, height), ''

          manifest = json.load(open('manifest.webmanifest', encoding='utf-8'))
          problems = []
          checked = []
          for icon in manifest.get('icons', []):
              src = icon.get('src', '').lstrip('./')
              if not os.path.exists(src):
                  problems.append('清单引用的图标不存在：' + src)
                  continue
              size, err = inspect(src)
              if err:
                  problems.append('%s %s' % (src, err))
                  continue
              checked.append(src)
              declared = str(icon.get('sizes', '')).lower()
              if 'any' in declared:
                  continue
              real_text = '%dx%d' % size
              if declared != real_text:
                  problems.append('%s 声明 %s，实际 %s' % (src, declared, real_text))

          # 桌面版图标单独校验（不写在 manifest 里，但决定 exe / 任务栏图标）
          for extra in ('desktop/build/icon.png',):
              if not os.path.exists(extra):
                  problems.append('缺少桌面图标：' + extra)
                  continue
              size, err = inspect(extra)
              if err:
                  problems.append('%s %s' % (extra, err))
              elif min(size) < 256:
                  problems.append('%s 太小（%dx%d），electron-builder 至少要 256x256' % (extra, size[0], size[1]))

          if problems:
              print('::error::' + '；'.join(problems))
              sys.exit(1)
          print('图标完整性与清单一致：' + ', '.join(checked))
          PY

      - name: Start local server and check entrypoint
        run: |
          # GitHub Actions 会在步骤结束时回收该步骤启动的子进程，
          # 所以必须 nohup + disown，并原地做就绪探测。
          nohup python -m http.server 8765 --bind 127.0.0.1 >/tmp/piano-studio-http.log 2>&1 &
          disown || true
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/index.html | grep -q 'PIANO STUDIO'; then
              echo "entrypoint OK"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::本地服务未就绪，http.server 日志："
          cat /tmp/piano-studio-http.log
          exit 1

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save --no-fund --no-audit @playwright/test@1.50.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npx playwright test .github/smoke.spec.cjs --reporter=line
