name: Validate PIANO STUDIO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Check manifest icons match real files
        run: |
          # 图标尺寸写错（例如清单写 1536x1536、文件其实是 1254x1254）会让浏览器
          # 在「安装到主屏幕」时挑不到图标，肉眼又看不出来，所以放进 CI 守住。
          python - <<'PY'
          import json, os, struct, sys

          def png_size(path):
              with open(path, 'rb') as fh:
                  head = fh.read(24)
              if head[:8] != b'\x89PNG\r\n\x1a\n' or head[12:16] != b'IHDR':
                  return None
              return struct.unpack('>II', head[16:24])

          manifest = json.load(open('manifest.webmanifest', encoding='utf-8'))
          problems = []
          for icon in manifest.get('icons', []):
              src = icon.get('src', '').lstrip('./')
              if not os.path.exists(src):
                  problems.append('清单引用的图标不存在：' + src)
                  continue
              real = png_size(src)
              declared = str(icon.get('sizes', '')).lower()
              if real is None:
                  problems.append(src + ' 不是有效的 PNG')
                  continue
              real_text = '%dx%d' % real
              if 'any' in declared:
                  continue
              if declared != real_text:
                  problems.append('%s 声明 %s，实际 %s' % (src, declared, real_text))
          if problems:
              print('::error::' + '；'.join(problems))
              sys.exit(1)
          print('manifest 图标与文件一致')
          PY

      - name: Start local server and check entrypoint
        run: |
          # GitHub Actions 会在步骤结束时回收该步骤启动的子进程，
          # 所以必须 nohup + disown，并原地做就绪探测。
          nohup python -m http.server 8765 --bind 127.0.0.1 >/tmp/piano-studio-http.log 2>&1 &
          disown || true
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/index.html | grep -q 'PIANO STUDIO'; then
              echo "entrypoint OK"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::本地服务未就绪，http.server 日志："
          cat /tmp/piano-studio-http.log
          exit 1

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save --no-fund --no-audit @playwright/test@1.50.0
          npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npx playwright test .github/smoke.spec.cjs --reporter=line
