name: Validate PIANO STUDIO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Start local server and check entrypoint
        run: |
          # GitHub Actions 会在步骤结束时回收该步骤启动的子进程，
          # 所以必须 nohup + disown，并原地做就绪探测。
          nohup python -m http.server 8765 --bind 127.0.0.1 >/tmp/piano-studio-http.log 2>&1 &
          disown || true
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/index.html | grep -q 'PIANO STUDIO'; then
              echo "entrypoint OK"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::本地服务未就绪，http.server 日志："
          cat /tmp/piano-studio-http.log
          exit 1

      - name: Install Chromium
        run: npx --yes @playwright/test@1.50.0 install --with-deps chromium

      - name: Run browser smoke test
        run: npx --yes @playwright/test@1.50.0 test .github/smoke.spec.cjs --reporter=line
