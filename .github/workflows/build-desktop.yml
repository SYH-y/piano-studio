name: Build Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-fund --no-audit

      - name: Build installer and portable exe
        working-directory: desktop
        run: npx electron-builder --win nsis portable --publish never

      - name: Smoke test the packaged app
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'PianoStudio-Portable-*.exe' | Select-Object -First 1
          if (-not $exe) { throw '未生成 portable exe' }
          $out = Join-Path $PWD 'smoke.png'
          & $exe.FullName --smoke "--out=$out" | Tee-Object -Variable log | Out-Host
          if (-not ($log -match 'SMOKE RESULT=PASS')) { throw '打包后的应用冒烟测试未通过' }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piano-studio-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/smoke.png
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
