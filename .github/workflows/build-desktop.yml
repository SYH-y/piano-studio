name: Build Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        env:
          # GitHub Releases 的 Electron 二进制有时会 5xx / 超时，用镜像兜底
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npm install --no-fund --no-audit

      - name: Check Windows signing configuration
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD) {
            Write-Host 'Windows code signing is configured'
          } elseif ($env:RELEASE_BUILD -eq 'true') {
            throw '发布 Tag 缺少 WINDOWS_CERTIFICATE_BASE64 或 WINDOWS_CERTIFICATE_PASSWORD，已阻止生成未签名发布包'
          } else {
            Write-Warning 'Windows signing secrets are missing; workflow_dispatch 将生成未签名测试包'
          }

      - name: Build installer and portable exe
        working-directory: desktop
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npx electron-builder --win nsis portable --publish never

      - name: Verify Windows signatures
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist -Filter 'PianoStudio-*.exe')
          if ($files.Count -lt 2) { throw '未找到完整的 Windows 安装包和便携版产物' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Windows 签名校验失败：$($file.Name) -> $($signature.Status)"
            }
            Write-Host "$($file.Name) 已签名：$($signature.SignerCertificate.Subject)"
          }

      - name: Smoke test the packaged app
        working-directory: desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'PianoStudio-Portable-*.exe' | Select-Object -First 1
          if (-not $exe) { throw '未生成 portable exe' }
          $out = Join-Path $PWD 'dist/smoke.png'
          $res = Join-Path $PWD 'dist/smoke.json'
          if (Test-Path $res) { Remove-Item $res -Force }
          # GUI 程序：必须 Start-Process -Wait，且结果以落盘文件为准（stdout 收不到）
          Start-Process -FilePath $exe.FullName -ArgumentList '--smoke', "--out=$out", "--result=$res" -Wait
          if (-not (Test-Path $res)) { throw '冒烟测试没有写出结果文件' }
          Get-Content $res | Out-Host
          $r = Get-Content $res -Raw | ConvertFrom-Json
          if ($r.ok -ne $true) { throw "打包后的应用冒烟测试未通过：$($r | ConvertTo-Json -Compress)" }
          Write-Host '打包后冒烟测试通过'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piano-studio-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/smoke.png
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml / *.blockmap 是 electron-updater 的更新清单，
          # 少了它们应用内「检查更新」就找不到新版本
          files: |
            desktop/dist/*.exe
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap